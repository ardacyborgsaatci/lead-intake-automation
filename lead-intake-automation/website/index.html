<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightline Studio | Start a project</title>
  <meta name="description" content="Tell us about your project and we will get back to you within one business day.">
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --text: #1d1d1b;
      --muted: #6a6a64;
      --border: #dcdad2;
      --accent: #1f5eff;
      --accent-text: #ffffff;
      --error: #b3261e;
      --success: #1b7a43;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121211;
        --surface: #1c1c1a;
        --text: #f0efe9;
        --muted: #a3a29a;
        --border: #34342f;
        --accent: #6c93ff;
        --accent-text: #0b0b0a;
        --error: #ff8a80;
        --success: #6fd49a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
    .brand { font-weight: 700; letter-spacing: 0.02em; margin-bottom: 32px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    .lede { color: var(--muted); margin: 0 0 32px; }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .row { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; color: var(--muted); margin: 8px 0 20px; }
    .consent input { margin-top: 4px; }
    .consent label { font-weight: 400; font-size: inherit; margin: 0; }
    button {
      width: 100%;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 16px; min-height: 1.5em; font-weight: 600; }
    #status.error { color: var(--error); }
    #status.success { color: var(--success); }
    /* Honeypot: hidden from people, visible to naive bots */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Brightline Studio</div>
    <h1>Start a project</h1>
    <p class="lede">Tell us a little about what you need. We reply within one business day.</p>

    <form id="lead-form" novalidate>
      <div class="row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" autocomplete="organization" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="companySize">Company size</label>
          <select id="companySize" name="companySize" required>
            <option value="" disabled selected>Select</option>
            <option>1-10</option>
            <option>11-50</option>
            <option>51-200</option>
            <option>200+</option>
          </select>
        </div>
        <div class="field">
          <label for="budget">Budget</label>
          <select id="budget" name="budget" required>
            <option value="" disabled selected>Select</option>
            <option>Under $1k</option>
            <option>$1k-$5k</option>
            <option>$5k-$20k</option>
            <option>$20k+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="timeline">Timeline</label>
        <select id="timeline" name="timeline" required>
          <option value="" disabled selected>Select</option>
          <option>This month</option>
          <option>1-3 months</option>
          <option>3+ months</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <textarea id="message" name="message" maxlength="2000"></textarea>
      </div>

      <div class="hp" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="consent">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I agree to be contacted about my project.</label>
      </div>

      <button type="submit" id="submit">Send</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <footer>Demo project. Submissions are used only to test this automation.</footer>
  </main>

  <script>
    const form = document.getElementById('lead-form');
    const button = document.getElementById('submit');
    const status = document.getElementById('status');

    function show(message, kind) {
      status.textContent = message;
      status.className = kind;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      show('', '');

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const data = Object.fromEntries(new FormData(form));
      data.consent = form.elements.consent.checked;

      button.disabled = true;
      button.textContent = 'Sending...';

      try {
        const response = await fetch('/api/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await response.json().catch(() => ({}));
        if (response.ok) {
          form.reset();
          show('Thanks! We will be in touch within one business day.', 'success');
        } else {
          show(result.error || 'Something went wrong. Please try again.', 'error');
        }
      } catch (err) {
        show('Network error. Please check your connection and try again.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
